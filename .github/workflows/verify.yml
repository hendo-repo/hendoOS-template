name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: bun verify
      - name: Verify public commit history
        # Pull-request checkouts contain a provider-generated synthetic merge
        # commit whose identity is outside the submitted tree. PRs still run
        # the complete tree gate through `bun verify`; pushed public commits
        # receive the strict full-history scan here.
        if: github.repository == 'hendo-repo/hendoOS-template' && github.event_name != 'pull_request'
        run: bun scripts/check-public.ts --json
